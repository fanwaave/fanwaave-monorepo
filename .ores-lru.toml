# ORES Redis/LRU repository contract.
# Admitted interface: ores-redis-lru-cache/ores-lru-redis-interfaces@4474d240b38a4fe1dd24f01dcd2e9ab7a4c34b27.
# Runtime: ores-redis-lru-cache/ores-lru-redis.rs@d0afdae952a1efcfc3feaa9bdc145e3636457832; TJSV @2281843126ab644607b11cf8281d84f382d68dfc.
# REDIS_URL is an environment-variable name only. The same cache name is deliberately separated by client/server role.
protocol = "ores.lru-config.v1"
namespace = "fanwaave"
roles = ["client", "server"]

[redis]
urlEnv = "REDIS_URL"
keyPrefix = "ores:lru:fanwaave"
pubsubChannel = "ores:lru:fanwaave:events"
reconcileIntervalMs = 180000
reconnectMinMs = 1000
reconnectMaxMs = 30000

[defaults]
capacity = 1024
syncMode = "local_only"
overflowMode = "evict_lru"
failOpenOnStartup = false

[[roleOverrides]]
role = "server"
syncMode = "read_only"
overflowMode = "reject_and_reconcile"

[[caches]]
name = "runtime-env"
role = "client"
capacity = 256
syncMode = "local_only"
overflowMode = "reject_and_reconcile"

[[caches]]
name = "runtime-env"
role = "server"
capacity = 1024
syncMode = "read_only"
overflowMode = "reject_and_reconcile"
